[package]
name = "rshogi-dl-usi"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "USI engine using policy/value MCTS"

[dependencies]
anyhow.workspace = true
rshogi-core = { path = "../rshogi-core", default-features = false }
rshogi-dl = { path = "../rshogi-dl" }
rshogi-mcts = { path = "../rshogi-mcts" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
lazy-batch-metadata = ["rshogi-mcts/lazy-batch-metadata"]
onnx = ["rshogi-dl/onnx", "dep:libc"]
policy-validation-reduction = ["rshogi-dl/policy-validation-reduction"]

[[bin]]
name = "rshogi-dl-usi"
path = "src/main.rs"
required-features = ["onnx"]
